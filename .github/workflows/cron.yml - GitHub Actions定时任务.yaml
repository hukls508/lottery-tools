name: 彩票数据自动更新

on:
  schedule:
    # 每天北京时间 22:30 运行（UTC 14:30），双色球/大乐透开奖后更新
    - cron: '30 14 * * *'
  # 也支持手动触发
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 运行更新脚本
        id: update
        run: python update_data.py

      - name: 提交并推送更新
        if: steps.update.outputs.updated == 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/*.json
          git commit -m "自动更新彩票数据 (新增 ${{ steps.update.outputs.total_added }} 期)"
          git push
#（注：内容由AI生成）
