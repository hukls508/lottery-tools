<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩票选号娱乐工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.container {
    background: #fff;
    border-radius: 20px;
    padding: 40px;
    max-width: 800px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
h1 {
    text-align: center;
    color: #333;
    font-size: 28px;
    margin-bottom: 8px;
}
.subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 30px;
}
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}
.card {
    display: block;
    padding: 25px 20px;
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
}
.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.card .icon {
    font-size: 36px;
    margin-bottom: 10px;
}
.card .title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 6px;
}
.card .desc {
    font-size: 13px;
    opacity: 0.9;
}
.card.ssq { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
.card.dlt { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
.card.sport { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
.card.dantuo { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
.info {
    background: #f8f9fa;
    border-radius: 12px;
    padding: 20px;
    font-size: 13px;
    color: #666;
    line-height: 1.8;
}
.info strong { color: #333; }
.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #aaa;
}
</style>
</head>
<body>
<div class="container">
    <h1>🎰 彩票选号娱乐工具</h1>
    <p class="subtitle">数据自动更新 · 冷热分析 · 手动/随机选号</p>
    <div class="grid">
        <a href="ssq.html" class="card ssq">
            <div class="icon">🔴</div>
            <div class="title">双色球</div>
            <div class="desc">红球1-33选6 + 蓝球1-16选1</div>
        </a>
        <a href="dlt.html" class="card dlt">
            <div class="icon">🔵</div>
            <div class="title">大乐透</div>
            <div class="desc">前区1-35选5 + 后区1-12选2</div>
        </a>
        <a href="体彩综合选号工具.html" class="card sport">
            <div class="icon">🎲</div>
            <div class="title">体彩综合</div>
            <div class="desc">大乐透/排列3/排列5/7星彩</div>
        </a>
    </div>
    <div class="info">
        <strong>📌 使用说明：</strong><br>
        • 点击上方卡片进入对应玩法<br>
        • 开奖数据每天自动更新（GitHub Actions）<br>
        • 支持手动选号、一键随机生成多组号码<br>
        • 每组号码附带组合逻辑说明<br>
        • 本工具仅供娱乐参考，彩票有风险，投注需谨慎
    </div>
    <div class="footer">工作任务 · Turbo · 本地电脑 · 项目 · 按需确认 · 节能 · 连接器</div>
</div>
</body>
</html>
