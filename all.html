<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩票选号娱乐工具（综合版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;padding-bottom:60px}
.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:16px 20px;text-align:center}
.header h1{font-size:22px;margin-bottom:4px}
.header p{font-size:12px;opacity:.9}
.main-tabs{display:flex;background:#fff;border-bottom:2px solid #eee;position:sticky;top:0;z-index:100}
.main-tab{flex:1;padding:12px;text-align:center;cursor:pointer;font-size:15px;font-weight:600;color:#888;border-bottom:3px solid transparent;transition:all .2s}
.main-tab.active{color:#667eea;border-bottom-color:#667eea}
.sub-tabs{display:flex;flex-wrap:wrap;background:#fff;padding:8px 12px;gap:6px;border-bottom:1px solid #eee}
.sub-tab{padding:6px 14px;background:#f0f0f0;border-radius:16px;cursor:pointer;font-size:13px;color:#666;transition:all .2s}
.sub-tab.active{background:#667eea;color:#fff}
.container{padding:12px;max-width:1100px;margin:0 auto}
.game-panel{display:none}.game-panel.active{display:block}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card-title{font-size:15px;font-weight:bold;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:4px}
.tab{padding:4px 12px;background:#f0f0f0;border-radius:12px;cursor:pointer;font-size:12px;color:#666}
.tab.active{background:#667eea;color:#fff}
.stat-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.stat-item{flex:1;min-width:80px;background:#f8f9fa;border-radius:8px;padding:8px;text-align:center}
.stat-item .label{font-size:11px;color:#999}
.stat-item .value{font-size:16px;font-weight:bold;color:#333}
.table-wrap{overflow-x:auto}
.history-table{width:100%;border-collapse:collapse;font-size:12px}
.history-table th,.history-table td{border:1px solid #eee;padding:5px 4px;text-align:center}
.history-table th{background:#f5f5f5;color:#666;font-weight:600}
.ball{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;font-size:12px;font-weight:bold;margin:0 1px}
.ball-red{background:#e74c3c;color:#fff}
.ball-blue{background:#3498db;color:#fff}
.ball-orange{background:#f39c12;color:#fff}
.ball-green{background:#27ae60;color:#fff}
.ball-purple{background:#9b59b6;color:#fff}
.ball-digit{background:#95a5a6;color:#fff}
.ball-special{background:#e67e22;color:#fff}
.freq-grid{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-bottom:8px}
.freq-cell{text-align:center;padding:4px 2px;border-radius:6px;font-size:11px}
.freq-cell .num{font-weight:bold}
.freq-cell .cnt{font-size:10px;color:#666}
.freq-hot{background:#ffe0e0;border:1px solid #ff9999}
.freq-warm{background:#fff3e0;border:1px solid #ffcc80}
.freq-cold{background:#e3f2fd;border:1px solid #90caf9}
.freq-none{background:#f5f5f5;border:1px solid #e0e0e0}
.freq-label{font-size:12px;color:#666;margin:8px 0 4px;font-weight:600}
.freq-legend{display:flex;gap:12px;font-size:11px;color:#888;margin-top:8px}
.legend-box{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:middle}
.analysis-box{background:#f8f9fa;border-radius:8px;padding:10px;font-size:12px;line-height:1.8;margin-top:8px}
.analysis-box strong{color:#333}
.analysis-box ul{padding-left:18px;margin-top:4px}
.trend-section{margin-top:12px}
.trend-title{font-size:14px;font-weight:bold;margin-bottom:8px;padding-left:8px;border-left:3px solid #667eea}
.trend-wrap{overflow-x:auto;max-height:350px;overflow-y:auto;border:1px solid #eee;border-radius:8px}
.trend-table{width:100%;border-collapse:collapse;font-size:11px}
.trend-table th,.trend-table td{border:1px solid #e0e0e0;padding:3px 2px;text-align:center;min-width:20px}
.trend-table th{background:#f5f5f5;font-weight:600;color:#666;position:sticky;top:0}
.trend-table .issue-col{background:#fafafa;color:#888;font-size:10px;min-width:48px}
.trend-table .hit-red{background:#e74c3c;color:#fff;border-radius:50%;font-weight:bold}
.trend-table .hit-blue{background:#3498db;color:#fff;border-radius:50%;font-weight:bold}
.trend-table .hit-orange{background:#f39c12;color:#fff;border-radius:50%;font-weight:bold}
.trend-table .hit-green{background:#27ae60;color:#fff;border-radius:50%;font-weight:bold}
.trend-table .miss{color:#ccc}
.trend-tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.trend-tab{padding:4px 12px;background:#f0f0f0;border-radius:12px;cursor:pointer;font-size:12px;color:#666}
.trend-tab.active{background:#667eea;color:#fff}
.play-tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:2px solid #eee}
.play-tab{padding:8px 16px;cursor:pointer;font-size:13px;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px}
.play-tab.active{color:#e74c3c;border-bottom-color:#e74c3c;font-weight:bold}
.play-panel{display:none}.play-panel.active{display:block}
.picker-label{font-size:13px;font-weight:600;margin-bottom:6px;color:#555}
.picker-label .count{color:#e74c3c;font-weight:700}
.picker-label .hint{color:#999;font-weight:normal;font-size:11px;margin-left:6px}
.number-grid{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-bottom:10px}
.number-grid.blue-grid{grid-template-columns:repeat(8,1fr)}
.num-btn{padding:6px 0;text-align:center;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:13px;background:#fff;transition:all .15s;user-select:none}
.num-btn:hover{border-color:#667eea}
.num-btn.selected-front{background:#e74c3c;color:#fff;border-color:#e74c3c}
.num-btn.selected-back{background:#3498db;color:#fff;border-color:#3498db}
.num-btn.selected-red{background:#e74c3c;color:#fff;border-color:#e74c3c}
.num-btn.selected-blue{background:#3498db;color:#fff;border-color:#3498db}
.num-btn.dan{background:#c0392b!important;color:#fff!important;border-color:#c0392b!important}
.num-btn.tuo{background:#e67e22!important;color:#fff!important;border-color:#e67e22!important}
.digit-row{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.digit-box{text-align:center}
.digit-box label{display:block;font-size:11px;color:#888;margin-bottom:2px}
.digit-box select{padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:14px}
.action-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.btn-primary{background:#667eea;color:#fff}
.btn-primary:hover{background:#5568d3}
.btn-orange{background:#f39c12;color:#fff}
.btn-orange:hover{background:#e08e0b}
.btn-green{background:#27ae60;color:#fff}
.btn-green:hover{background:#219a52}
.btn-secondary{background:#ecf0f1;color:#555}
.btn-secondary:hover{background:#d5dbdb}
.input-group{display:flex;align-items:center;gap:4px;font-size:13px;color:#666}
.input-group input{width:50px;padding:6px;border:1px solid #ddd;border-radius:4px;text-align:center}
.bet-info{background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:13px;color:#795548;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.bet-info .bet-num{font-size:18px;font-weight:bold;color:#e74c3c}
.bet-info .bet-amount{font-size:16px;font-weight:bold;color:#333}
.ticket-list{margin-top:8px}
.ticket-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #f0f0f0}
.ticket-index{width:24px;height:24px;line-height:24px;text-align:center;background:#667eea;color:#fff;border-radius:50%;font-size:12px;font-weight:bold;flex-shrink:0}
.ticket-body{flex:1;min-width:0}
.ticket-nums{margin-bottom:4px;font-size:13px}
.ticket-desc{font-size:11px;color:#888;line-height:1.5}
.ticket-del{background:none;border:none;color:#ccc;font-size:18px;cursor:pointer;padding:0 4px}
.ticket-del:hover{color:#e74c3c}
.empty-tip{text-align:center;color:#bbb;padding:20px;font-size:13px}
.loading{text-align:center;padding:40px;color:#999}
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:8px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap;z-index:100}
.footer-btn{padding:5px 10px;font-size:11px;background:#f0f0f0;border:none;border-radius:4px;cursor:pointer;color:#666}
.footer-btn:hover{background:#e0e0e0}
@media(max-width:600px){.number-grid{grid-template-columns:repeat(7,1fr)}.freq-grid{grid-template-columns:repeat(7,1fr)}.container{padding:8px}}
</style>
</head>
<body>
<div class="header">
  <h1>🎰 彩票选号娱乐工具（综合版）</h1>
  <p>福利彩票 + 体育彩票 · 复式胆拖 · 走势图 · 数据自动更新</p>
</div>

<div class="main-tabs">
  <div class="main-tab active" onclick="switchMain('fc',this)">🎁 福利彩票</div>
  <div class="main-tab" onclick="switchMain('tc',this)">🏆 体育彩票</div>
</div>

<!-- 福利彩票子tab -->
<div class="sub-tabs" id="fc-tabs">
  <div class="sub-tab active" onclick="switchGame('ssq',this)">双色球</div>
  <div class="sub-tab" onclick="switchGame('3d',this)">福彩3D</div>
  <div class="sub-tab" onclick="switchGame('15x5',this)">15选5</div>
  <div class="sub-tab" onclick="switchGame('kl8',this)">快乐8</div>
</div>
<!-- 体育彩票子tab -->
<div class="sub-tabs" id="tc-tabs" style="display:none">
  <div class="sub-tab active" onclick="switchGame('dlt',this)">大乐透</div>
  <div class="sub-tab" onclick="switchGame('p3',this)">排列3</div>
  <div class="sub-tab" onclick="switchGame('p5',this)">排列5</div>
  <div class="sub-tab" onclick="switchGame('qxc',this)">7星彩</div>
</div>

<div class="container" id="gameContainer"></div>

<div class="footer">
  <button class="footer-btn" onclick="alert('工作任务')">工作任务</button>
  <button class="footer-btn" onclick="alert('Turbo')">Turbo</button>
  <button class="footer-btn" onclick="alert('本地电脑')">本地电脑</button>
  <button class="footer-btn" onclick="alert('项目')">项目</button>
  <button class="footer-btn" onclick="alert('按需确认')">按需确认</button>
  <button class="footer-btn" onclick="alert('节能')">节能</button>
  <button class="footer-btn" onclick="alert('连接器')">连接器</button>
</div>

<script>
// ===== 工具函数 =====
function pad(n){return String(n).padStart(2,'0')}
function C(n,k){if(k<0||k>n)return 0;if(k===0||k===n)return 1;k=Math.min(k,n-k);let r=1;for(let i=0;i<k;i++)r=r*(n-i)/(i+1);return Math.round(r)}

// ===== 玩法配置 =====
const GAMES = {
  ssq:{name:'双色球',cat:'fc',type:'lotto',redMax:33,redPick:6,blueMax:16,bluePick:1,redClass:'ball-red',blueClass:'ball-blue',data:'data/ssq.json',supportDT:true,supportFS:true},
  '3d':{name:'福彩3D',cat:'fc',type:'digit',digits:3,maxes:[9,9,9],labels:['百位','十位','个位'],data:'data/3d.json',supportDT:false,supportFS:false},
  '15x5':{name:'15选5',cat:'fc',type:'lotto',redMax:15,redPick:5,blueMax:0,bluePick:0,redClass:'ball-orange',blueClass:'',data:'data/15x5.json',supportDT:false,supportFS:true},
  kl8:{name:'快乐8',cat:'fc',type:'lotto',redMax:80,redPick:20,blueMax:0,bluePick:0,redClass:'ball-green',blueClass:'',data:'data/kl8.json',supportDT:false,supportFS:false,pickRange:[1,10]},
  dlt:{name:'大乐透',cat:'tc',type:'lotto',redMax:35,redPick:5,blueMax:12,bluePick:2,redClass:'ball-red',blueClass:'ball-blue',data:'data/dlt.json',supportDT:true,supportFS:true},
  p3:{name:'排列3',cat:'tc',type:'digit',digits:3,maxes:[9,9,9],labels:['百位','十位','个位'],data:'data/p3.json',supportDT:false,supportFS:false},
  p5:{name:'排列5',cat:'tc',type:'digit',digits:5,maxes:[9,9,9,9,9],labels:['万位','千位','百位','十位','个位'],data:'data/p5.json',supportDT:false,supportFS:false},
  qxc:{name:'7星彩',cat:'tc',type:'digit',digits:7,maxes:[9,9,9,9,9,9,14],labels:['第一位','第二位','第三位','第四位','第五位','第六位','特别号'],data:'data/qxc.json',supportDT:false,supportFS:false}
};

// ===== 状态 =====
let currentMain='fc', currentGame='ssq';
const gameState={};
Object.keys(GAMES).forEach(k=>{gameState[k]={data:[],loaded:false,tickets:[],range:5,freq:5,playMode:'single',trendArea:'red',trendPos:0,selRed:new Set(),selBlue:new Set(),dtRedDan:new Set(),dtRedTuo:new Set(),dtBlueDan:new Set(),dtBlueTuo:new Set(),fsRed:new Set(),fsBlue:new Set(),digitSel:[]}});

// ===== 主分类切换 =====
function switchMain(cat,el){
  currentMain=cat;
  document.querySelectorAll('.main-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('fc-tabs').style.display=cat==='fc'?'flex':'none';
  document.getElementById('tc-tabs').style.display=cat==='tc'?'flex':'none';
  const firstGame=Object.keys(GAMES).find(k=>GAMES[k].cat===cat);
  document.querySelectorAll(`#${cat}-tabs .sub-tab`).forEach((t,i)=>{t.classList.toggle('active',i===0)});
  switchGame(firstGame, document.querySelector(`#${cat}-tabs .sub-tab`));
}

// ===== 玩法切换 =====
function switchGame(key,el){
  currentGame=key;
  document.querySelectorAll('.sub-tab').forEach(t=>t.classList.remove('active'));
  if(el)el.classList.add('active');
  renderGame();
  if(!gameState[key].loaded)loadGameData(key);
}

// ===== 加载数据 =====
async function loadGameData(key){
  const g=GAMES[key];
  try{
    const resp=await fetch(g.data+'?_t='+Date.now());
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    gameState[key].data=await resp.json();
    gameState[key].loaded=true;
    if(currentGame===key)renderGame();
  }catch(e){
    document.getElementById('gameContainer').innerHTML=`<div class="card"><div class="loading">数据加载失败：${e.message}<br>请确认 ${g.data} 文件存在</div></div>`;
  }
}

// ===== 渲染游戏主界面 =====
function renderGame(){
  const key=currentGame, g=GAMES[key], st=gameState[key];
  const container=document.getElementById('gameContainer');
  if(!st.loaded){container.innerHTML=`<div class="card"><div class="loading">正在加载${g.name}数据...</div></div>`;return;}
  let html='';
  // 历史开奖
  html+=renderHistory(key);
  // 频次冷热
  html+=renderFreq(key);
  // 走势图
  html+=renderTrendSection(key);
  // 选号中心
  html+=renderPicker(key);
  // 我的选号
  html+=renderTickets(key);
  container.innerHTML=html;
  // 初始化
  if(g.type==='digit')initDigitPicker(key);
  else initLottoPicker(key);
}

// ===== 历史开奖 =====
function renderHistory(key){
  const g=GAMES[key], st=gameState[key];
  const data=st.data.slice(0,st.range);
  let rows='';
  if(g.type==='lotto'){
    data.forEach(d=>{
      const reds=d.red.map(n=>`<span class="ball ${g.redClass}">${pad(n)}</span>`).join('');
      const blues=g.blueMax>0?d.blue.map(n=>`<span class="ball ${g.blueClass}">${pad(n)}</span>`).join(''):'';
      const sum=d.red.reduce((a,b)=>a+b,0);
      const odd=d.red.filter(n=>n%2).length;
      rows+=`<tr><td>${d.issue}</td><td>${d.date.slice(5)}</td><td>${reds}${blues?' + '+blues:''}</td><td>${sum}</td><td>${odd}:${d.red.length-odd}</td></tr>`;
    });
  }else{
    data.forEach(d=>{
      const balls=d.digits.map((n,i)=>`<span class="ball ${i===d.digits.length-1&&g.maxes[i]>=14?'ball-special':'ball-digit'}">${n}</span>`).join('');
      const sum=d.digits.reduce((a,b)=>a+b,0);
      const odd=d.digits.filter(n=>n%2).length;
      rows+=`<tr><td>${d.issue}</td><td>${d.date.slice(5)}</td><td>${balls}</td><td>${sum}</td><td>${odd}:${d.digits.length-odd}</td></tr>`;
    });
  }
  const cols=g.type==='lotto'?'<th>期号</th><th>日期</th><th>开奖号码</th><th>和值</th><th>奇偶</th>':'<th>期号</th><th>日期</th><th>开奖号码</th><th>和值</th><th>奇偶</th>';
  return `<div class="card"><div class="card-title"><span>历史开奖</span><div class="tabs">${[5,10,30].map(n=>`<div class="tab ${st.range===n?'active':''}" onclick="setRange('${key}',${n})">${n}天</div>`).join('')}</div></div><div class="table-wrap"><table class="history-table"><thead><tr>${cols}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function setRange(key,n){gameState[key].range=n;renderGame();}

// ===== 频次冷热 =====
function renderFreq(key){
  const g=GAMES[key], st=gameState[key];
  const data=st.data.slice(0,st.freq);
  let html=`<div class="card"><div class="card-title"><span>频次 & 冷热分析</span><div class="tabs">${[5,10,30].map(n=>`<div class="tab ${st.freq===n?'active':''}" onclick="setFreq('${key}',${n})">${n}天</div>`).join('')}</div></div>`;
  if(g.type==='lotto'){
    const fc={},bc={};
    for(let i=1;i<=g.redMax;i++)fc[i]=0;
    if(g.blueMax>0)for(let i=1;i<=g.blueMax;i++)bc[i]=0;
    data.forEach(d=>{d.red.forEach(n=>fc[n]++);if(g.blueMax>0)d.blue.forEach(n=>bc[n]++);});
    const fa=(data.length*g.redPick)/g.redMax;
    const cell=(num,cnt,avg,cls)=>{let c='freq-none';if(cnt===0)c='freq-none';else if(cnt>=avg*1.5)c='freq-hot';else if(cnt<=avg*.5)c='freq-cold';else c='freq-warm';return `<div class="freq-cell ${c}"><div class="num">${pad(num)}</div><div class="cnt">${cnt}</div></div>`;};
    html+=`<div class="freq-label">红球频次（1-${g.redMax}）</div><div class="freq-grid">${Array.from({length:g.redMax},(_,i)=>cell(i+1,fc[i+1],fa)).join('')}</div>`;
    if(g.blueMax>0){const ba=(data.length*g.bluePick)/g.blueMax;html+=`<div class="freq-label">蓝球频次（1-${g.blueMax}）</div><div class="freq-grid" style="grid-template-columns:repeat(8,1fr)">${Array.from({length:g.blueMax},(_,i)=>cell(i+1,bc[i+1],ba)).join('')}</div>`;}
    // 冷热分析
    const fs=Object.entries(fc).sort((a,b)=>b[1]-a[1]);
    const hot=fs.filter(([_,c])=>c>=fa*1.5&&c>0).map(([n])=>pad(+n));
    const cold=fs.filter(([_,c])=>c<=fa*.5).map(([n])=>pad(+n));
    html+=`<div class="analysis-box"><strong>近${st.freq}天冷热分析（${data.length}期）：</strong><ul><li><strong>热号</strong>：${hot.length?hot.slice(0,6).join('、'):'无'}</li><li><strong>冷号</strong>：${cold.length?cold.slice(0,6).join('、'):'无'}</li><li><strong>选号建议</strong>：热温冷搭配，和值适中，奇偶均衡</li><li style="color:#999">※ 彩票为独立随机事件，仅供娱乐参考</li></ul></div>`;
  }else{
    // 数字型
    for(let pos=0;pos<g.digits;pos++){
      const fc={};for(let i=0;i<=g.maxes[pos];i++)fc[i]=0;
      data.forEach(d=>fc[d.digits[pos]]++);
      const avg=data.length/(g.maxes[pos]+1);
      const cell=(num,cnt)=>{let c='freq-none';if(cnt===0)c='freq-none';else if(cnt>=avg*1.5)c='freq-hot';else if(cnt<=avg*.5)c='freq-cold';else c='freq-warm';return `<div class="freq-cell ${c}"><div class="num">${num}</div><div class="cnt">${cnt}</div></div>`;};
      html+=`<div class="freq-label">${g.labels[pos]}频次（0-${g.maxes[pos]}）</div><div class="freq-grid" style="grid-template-columns:repeat(${Math.min(g.maxes[pos]+1,10)},1fr)">${Array.from({length:g.maxes[pos]+1},(_,i)=>cell(i,fc[i])).join('')}</div>`;
    }
  }

}

      document.getElementById('fsRedCount').textContent=st.fsRed.size;
    }
    if(g.blueMax>0){
      const fbg=document.getElementById('fsBlueGrid');
      if(fbg){
        fbg.innerHTML='';
        for(let i=1;i<=g.blueMax;i++){const b=document.createElement('div');b.className='num-btn'+(st.fsBlue.has(i)?' selected-blue':'');b.textContent=pad(i);b.onclick=()=>{if(st.fsBlue.has(i))st.fsBlue.delete(i);else st.fsBlue.add(i);initLottoPicker(key);};fbg.appendChild(b);}
        document.getElementById('fsBlueCount').textContent=st.fsBlue.size;
      }
    }
    calcFsBet(key);
  }
  // 胆拖
  if(g.supportDT){
    const grids=[['dtRedDanGrid','dtRedDan','redDan'],['dtRedTuoGrid','dtRedTuo','redTuo']];
    if(g.blueMax>0)grids.push(['dtBlueDanGrid','dtBlueDan','blueDan'],['dtBlueTuoGrid','dtBlueTuo','blueTuo']);
    grids.forEach(([gridId,setKey,type])=>{
      const el=document.getElementById(gridId);
      if(!el)return;
      el.innerHTML='';
      const max=type.startsWith('red')?g.redMax:g.blueMax;

function toggleDtNum(key,type,n){
  const st=gameState[key], g=GAMES[key];
  const maxDan=type.startsWith('red')?g.redPick-1:g.bluePick-1;
  const danSet=type.startsWith('red')?st.dtRedDan:st.dtBlueDan;
  const tuoSet=type.startsWith('red')?st.dtRedTuo:st.dtBlueTuo;
  if(type.endsWith('Dan')){
    if(danSet.has(n))danSet.delete(n);
    else{if(danSet.size>=maxDan){alert('胆码最多'+maxDan+'个');return;}tuoSet.delete(n);danSet.add(n);}
  }else{
    if(tuoSet.has(n))tuoSet.delete(n);
    else{if(danSet.has(n)){alert('该号码已是胆码');return;}tuoSet.add(n);}
  }
  initLottoPicker(key);
}
function calcFsBet(key){
  const g=GAMES[key], st=gameState[key];
  const info=document.getElementById('fsBetInfo');
  if(!info)return;
  const r=st.fsRed.size, b=st.fsBlue.size;
  if(r<g.redPick+1){info.innerHTML='<span style="color:#e74c3c">红球至少选'+(g.redPick+1)+'个</span>';return;}
  if(g.blueMax>0&&b<g.bluePick+1){info.innerHTML='<span style="color:#e74c3c">蓝球至少选'+(g.bluePick+1)+'个</span>';return;}
  const blueBet=g.blueMax>0?C(b,g.bluePick):1;
  const total=C(r,g.redPick)*blueBet;
  info.innerHTML=`<span>红球 ${C(r,g.redPick)} 注 × 蓝球 ${blueBet} 注 = <span class="bet-num">${total}</span> 注</span><span class="bet-amount">￥${total*2}</span>`;
}
function calcDtBet(key){
  const g=GAMES[key], st=gameState[key];
  const info=document.getElementById('dtBetInfo');
  if(!info)return;
  const rd=st.dtRedDan.size, rt=st.dtRedTuo.size;
  const bd=st.dtBlueDan.size, bt=st.dtBlueTuo.size;
  if(rd<1){info.innerHTML='<span style="color:#e74c3c">红球胆码至少选1个</span>';return;}
  if(rt<g.redPick-rd){info.innerHTML='<span style="color:#e74c3c">红球拖码至少选'+(g.redPick-rd)+'个</span>';return;}
  if(g.blueMax>0&&bt<g.bluePick-bd){info.innerHTML='<span style="color:#e74c3c">蓝球拖码至少选'+(g.bluePick-bd)+'个</span>';return;}
  const redBet=C(rt,g.redPick-rd);
  const blueBet=g.blueMax>0?C(bt,g.bluePick-bd):1;
  const total=redBet*blueBet;
  info.innerHTML=`<span>红球 ${redBet} 注 × 蓝球 ${blueBet} 注 = <span class="bet-num">${total}</span> 注</span><span class="bet-amount">￥${total*2}</span>`;
}

// ===== 添加票 =====
function lottoDesc(red,blue,g){
  const sorted=[...red].sort((a,b)=>a-b);
  const sum=sorted.reduce((a,b)=>a+b,0), odd=sorted.filter(n=>n%2).length;
  let x=`和值${sum}，奇偶${odd}:${red.length-odd}`;
  let cons=0;for(let i=1;i<sorted.length;i++)if(sorted[i]===sorted[i-1]+1)cons++;
  if(cons>0)x+=`，${cons}组连号`;
  if(blue&&blue.length)x+=`。蓝球${blue.map(pad).join('、')}`;
  return x+'。';
}
function addSingle(key){
  const g=GAMES[key], st=gameState[key];
  if(st.selRed.size!==g.redPick){alert('请选满'+g.redPick+'个红球');return;}
  if(g.blueMax>0&&st.selBlue.size!==g.bluePick){alert('请选满'+g.bluePick+'个蓝球');return;}
  st.tickets.push({red:[...st.selRed].sort((a,b)=>a-b),blue:[...st.selBlue].sort((a,b)=>a-b),desc:lottoDesc([...st.selRed],[...st.selBlue],g),type:'单式'});
  st.selRed.clear();st.selBlue.clear();renderGame();
}

  if(st.fsRed.size<g.redPick+1){alert('红球至少选'+(g.redPick+1)+'个');return;}
  if(g.blueMax>0&&st.fsBlue.size<g.bluePick+1){alert('蓝球至少选'+(g.bluePick+1)+'个');return;}
  const blueBet=g.blueMax>0?C(st.fsBlue.size,g.bluePick):1;
  const total=C(st.fsRed.size,g.redPick)*blueBet;
  const desc=`复式：红球${[...st.fsRed].sort((a,b)=>a-b).map(pad).join('、')}（${st.fsRed.size}个）${g.blueMax>0?`；蓝球${[...st.fsBlue].sort((a,b)=>a-b).map(pad).join('、')}（${st.fsBlue.size}个）`:''}。共${total}注，￥${total*2}`;
  st.tickets.push({red:[...st.fsRed].sort((a,b)=>a-b),blue:[...st.fsBlue].sort((a,b)=>a-b),desc,type:'复式'});

function genRandom(key){
  const g=GAMES[key], st=gameState[key];
  const c=Math.min(20,Math.max(1,parseInt(document.getElementById('randomCount').value)||5));
  for(let i=0;i<c;i++){
    if(g.type==='lotto'){
      const red=new Set();while(red.size<g.redPick)red.add(Math.floor(Math.random()*g.redMax)+1);
      const blue=new Set();if(g.blueMax>0)while(blue.size<g.bluePick)blue.add(Math.floor(Math.random()*g.blueMax)+1);
      st.tickets.push({red:[...red].sort((a,b)=>a-b),blue:[...blue].sort((a,b)=>a-b),desc:lottoDesc([...red],[...blue],g),type:'单式'});
    }else{
      const digits=Array.from({length:g.digits},(_,j)=>Math.floor(Math.random()*(g.maxes[j]+1)));
      const sum=digits.reduce((a,b)=>a+b,0), odd=digits.filter(n=>n%2).length;
      st.tickets.push({digits,desc:`${g.name}：${digits.join('')}，和值${sum}，奇偶${odd}:${digits.length-odd}。`,type:'单式'});
    }
  }
  renderGame();
}

        nums=reds+(blues?' + '+blues:'');
      }else{
        nums=t.digits.map((n,idx)=>`<span class="ball ${idx===t.digits.length-1&&g.maxes[idx]>=14?'ball-special':'ball-digit'}">${n}</span>`).join('');
      }
      html+=`<div class="ticket-item"><div class="ticket-index">${i+1}</div><div class="ticket-body"><div class="ticket-nums">${typeTag}${nums}</div><div class="ticket-desc">${t.desc}</div></div><button class="ticket-del" onclick="delTicket('${key}',${i})">×</button></div>`;
    });
  }
  html+='</div></div>';
  return html;
}

// ===== 初始化 =====
loadGameData('ssq');
renderGame();
</script>
